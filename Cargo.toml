[package]
name = "eckly"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal client for reading and managing Readeck bookmarks"
license = "GPL-3.0-or-later"
repository = "https://github.com/gollyhatch/eckly"
keywords = ["readeck", "tui", "bookmarks", "read-later", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "eckly"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
ego-tree = "0.11"
html-escape = "0.2.13"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
indicatif = "0.18.6"
opaline = "0.4.2"
open = "5.4.5"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "query"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
toml = "1.2.1"
unicode-width = "0.2.3"
url = "2.5.8"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
